name: entrack-plataforma

x-common-environment: &common-environment
  DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-entrack_plataforma}
  DB_USER: ${DB_USER:?Set DB_USER in .env}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_SSL_MODE: ${DB_SSL_MODE:-require}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:?Set GOOGLE_MAPS_API_KEY in .env}
  MEDIAMTX_WEBRTC_URL: ${MEDIAMTX_WEBRTC_URL:-}
  MEDIAMTX_RTMP_URL: ${MEDIAMTX_RTMP_URL:-}
  MEDIAMTX_RTSP_URL: ${MEDIAMTX_RTSP_URL:-}
  JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1g}
  APP_URL: ${APP_URL:-http://localhost}
  SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
  SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
  SMTP_FROM: ${SMTP_FROM:-}
  FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:?Set FIREBASE_SERVICE_ACCOUNT in .env}
  SMS_HTTP_URL: ${SMS_HTTP_URL:?Set SMS_HTTP_URL in .env}
  SMS_HTTP_AUTHORIZATION: ${SMS_HTTP_AUTHORIZATION:-}
  GEOCODER_URL: ${GEOCODER_URL:?Set GEOCODER_URL in .env}
  GEOLOCATION_KEY: ${GEOLOCATION_KEY:?Set GEOLOCATION_KEY in .env}

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      receiver:
        condition: service_healthy
      backend:
        condition: service_started
      dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  dashboard:
    image: ghcr.io/entrack-plataforma/traccar-dash:${DASHBOARD_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "80"

  backend:
    image: ghcr.io/entrack-plataforma/entrack-api:${BACKEND_VERSION:-latest}
    restart: unless-stopped
    environment: *common-environment
    expose:
      - "8080"

  receiver:
    image: ghcr.io/entrack-plataforma/traccar:${RECEIVER_VERSION:-latest}
    restart: unless-stopped
    environment: *common-environment
    volumes:
      - receiver_logs:/opt/traccar/logs
      - receiver_media:/opt/traccar/media
      - receiver_data:/opt/traccar/data
    ports:
      - "5000-5300:5000-5300/tcp"
      - "5000-5300:5000-5300/udp"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8082/api/server"]
      interval: 2m
      timeout: 5s
      start_period: 1h
      start_interval: 10s
      retries: 3
    stop_grace_period: 1m

volumes:
  receiver_logs:
  receiver_media:
  receiver_data:
